<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EDEFF2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14171C" media="(prefers-color-scheme: dark)">
  <title>KostenSplit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 3h18v24l-3-2-3 2-3-2-3 2-3-2-3 2z' fill='%23fff' stroke='%231C2233' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M11 10h10M11 15h10' stroke='%231C2233' stroke-width='2' stroke-linecap='round'/%3E%3Crect x='10' y='18' width='12' height='4' rx='1' fill='%23D6DAE0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Kopfzeile -->
    <header class="navbar">
      <button id="btn-back" class="nav-zurueck hidden" type="button" aria-label="Zurück zu den Gruppen">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Gruppen</span>
      </button>
      <h1 id="nav-title">KostenSplit</h1>
    </header>

    <main class="container">
      <!-- Screen 1: Gruppenübersicht -->
      <section id="screen-dashboard" class="screen active">
        <div class="section-header">
          <h2>Deine Gruppen</h2>
          <button id="btn-add-file" class="btn btn-secondary btn-sm" type="button">+ Gruppe</button>
        </div>
        <div id="groups-list" class="gruppen-liste"></div>
      </section>

      <!-- Screen 2: Gruppenansicht -->
      <section id="screen-group" class="screen hidden">
        <p id="sync-status" class="sync-status hidden" role="status"></p>

        <section id="balances-card" class="bilanz" aria-labelledby="bilanz-titel">
          <h2 id="bilanz-titel" class="visually-hidden">Bilanz</h2>
          <div id="group-summary" class="summe"></div>
          <div id="balances-list" class="salden"></div>
          <button id="btn-manage-persons" class="btn btn-ghost btn-sm" type="button">Personen verwalten</button>
        </section>

        <div class="section-header">
          <h2>Ausgaben</h2>
          <span id="tx-count" class="section-zahl"></span>
        </div>
        <div class="bon-schatten">
          <div id="transactions-list" class="bon"></div>
        </div>

        <button id="btn-add-tx" class="fab" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          Ausgabe
        </button>
      </section>
    </main>

    <!-- Modal: Ausgabe erstellen/bearbeiten -->
    <div id="modal-tx" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-tx-title">
      <div class="modal-content">
        <h3 id="modal-tx-title">Neue Ausgabe</h3>
        <form id="form-tx">
          <!-- Honeypot Feld gegen Bots -->
          <input type="text" name="b_honeypot" id="b_honeypot" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
          <input type="hidden" id="tx-id">

          <div class="feld feld-betrag">
            <label for="tx-amount">Betrag</label>
            <div class="betrag-eingabe">
              <input type="number" step="0.01" min="0" inputmode="decimal" id="tx-amount" required placeholder="0,00">
              <span aria-hidden="true">€</span>
            </div>
          </div>

          <div class="feld">
            <label for="tx-desc">Wofür?</label>
            <input type="text" id="tx-desc" required placeholder="z. B. Abendessen" autocomplete="off">
          </div>

          <div class="feld-reihe">
            <div class="feld">
              <label for="tx-date">Datum</label>
              <input type="date" id="tx-date" required>
            </div>
            <div class="feld">
              <label for="tx-payer">Bezahlt von</label>
              <select id="tx-payer" required></select>
            </div>
          </div>

          <div class="feld">
            <label for="tx-category">Kategorie</label>
            <input type="text" id="tx-category" list="category-suggestions" placeholder="z. B. Essen & Trinken" autocomplete="off">
            <datalist id="category-suggestions">
              <option value="Essen & Trinken">
              <option value="Unterkunft">
              <option value="Transport">
              <option value="Einkauf">
              <option value="Freizeit">
              <option value="Sonstiges">
            </datalist>
          </div>

          <label class="schalter">
            <input type="checkbox" id="tx-compensation">
            <span class="schalter-text">Ausgleichszahlung<small>Jemand zahlt Schulden zurück</small></span>
          </label>

          <div class="aufteilung" role="group" aria-labelledby="aufteilung-titel">
            <div class="aufteilung-kopf">
              <span id="aufteilung-titel" class="aufteilung-titel">Aufteilung</span>
              <label class="schalter schalter-klein">
                <input type="checkbox" id="tx-auto-split" checked>
                <span class="schalter-text">Gleichmäßig</span>
              </label>
            </div>
            <div id="tx-splits-container"></div>
            <p id="tx-splits-summe" class="splits-summe" aria-live="polite"></p>
          </div>

          <div class="modal-actions">
            <button type="button" id="btn-tx-delete" class="btn btn-danger hidden">Löschen</button>
            <button type="button" id="btn-tx-cancel" class="btn btn-secondary">Abbrechen</button>
            <button type="submit" class="btn btn-primary">Speichern</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal: Personen verwalten -->
    <div id="modal-persons" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-persons-title">
      <div class="modal-content">
        <h3 id="modal-persons-title">Personen</h3>

        <div class="eingabe-reihe">
          <input type="text" id="new-person-name" placeholder="Name" aria-label="Name der neuen Person" autocomplete="off">
          <button id="btn-add-person" class="btn btn-primary" type="button">Hinzufügen</button>
        </div>

        <!-- Vorschläge aus anderen Projekten -->
        <div id="person-suggestions-box" class="vorschlaege hidden">
          <p class="klein-hinweis">Aus anderen Gruppen</p>
          <div id="person-suggestions" class="chips"></div>
        </div>

        <div id="persons-list" class="personen-liste"></div>

        <div class="modal-actions">
          <button id="btn-persons-close" class="btn btn-primary btn-breit" type="button">Fertig</button>
        </div>
      </div>
    </div>

    <!-- Modal: Sheet / Gruppe hinzufügen -->
    <div id="modal-add-group" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-add-group-title">
      <div class="modal-content">
        <h3 id="modal-add-group-title">Gruppe hinzufügen</h3>

        <!-- Bereits bekannte Dateien -->
        <div id="known-files-box" class="abschnitt hidden">
          <p class="abschnitt-titel">Bereits verknüpfte Google Sheets</p>
          <div id="known-files-list" class="auswahl-liste"></div>
        </div>

        <div class="abschnitt">
          <label class="abschnitt-titel" for="sheet-url-id">Google Sheet verknüpfen</label>
          <input type="text" id="sheet-url-id" placeholder="Link oder ID des Sheets" autocomplete="off">
          <button type="button" id="btn-scan-sheet" class="btn btn-secondary btn-breit">Sheet scannen</button>
        </div>

        <div id="scan-results" class="hidden">
          <div class="abschnitt">
            <p class="abschnitt-titel">Gruppen in diesem Sheet</p>
            <div id="existing-tabs-list" class="auswahl-liste"></div>
          </div>
          <div class="abschnitt">
            <label class="abschnitt-titel" for="new-tab-name">Oder neue Gruppe anlegen</label>
            <div class="eingabe-reihe">
              <input type="text" id="new-tab-name" placeholder="z. B. Italien 2026" autocomplete="off">
              <button type="button" id="btn-create-tab" class="btn btn-primary">Anlegen</button>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-add-group-cancel" class="btn btn-secondary btn-breit">Schließen</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/gas-api.js"></script>
  <script src="js/sheet-csv.js"></script>
  <script src="js/balances.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
