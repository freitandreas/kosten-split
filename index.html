<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KostenSplit</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="navbar">
      <h1 id="nav-title">KostenSplit</h1>
      <button id="btn-back" class="btn-icon hidden">← Zurück</button>
    </header>

    <!-- Main Container -->
    <main class="container">
      <!-- Screen 1: Gruppenübersicht -->
      <section id="screen-dashboard" class="screen active">
        <div class="section-header">
          <h2>Meine Gruppen</h2>
          <button id="btn-add-file" class="btn btn-primary">+ Sheet / Gruppe</button>
        </div>
        <div id="groups-list" class="card-list"></div>
      </section>

      <!-- Screen 2: Gruppenansicht -->
      <section id="screen-group" class="screen hidden">
        <div id="balances-card" class="card">
          <h3>Bilanz</h3>
          <div id="balances-list"></div>
          <button id="btn-manage-persons" class="btn btn-secondary btn-sm">Personen verwalten</button>
        </div>

        <div class="section-header">
          <h3>Ausgaben</h3>
          <button id="btn-add-tx" class="btn btn-primary">+ Ausgabe</button>
        </div>
        <div id="transactions-list" class="card-list"></div>
      </section>
    </main>

    <!-- Modal: Ausgabe erstellen/bearbeiten -->
    <div id="modal-tx" class="modal hidden">
      <div class="modal-content card">
        <h3 id="modal-tx-title">Neue Ausgabe</h3>
        <form id="form-tx">
          <!-- Honeypot Feld gegen Bots -->
          <input type="text" name="b_honeypot" id="b_honeypot" style="display:none;" tabindex="-1" autocomplete="off">

          <input type="hidden" id="tx-id">
          
          <label>Bezeichnung</label>
          <input type="text" id="tx-desc" required placeholder="z. B. Abendessen">

          <label>Betrag (€)</label>
          <input type="number" step="0.01" id="tx-amount" required placeholder="0.00">

          <label>Zahlende Person</label>
          <select id="tx-payer" required></select>

          <label class="checkbox-label">
            <input type="checkbox" id="tx-compensation"> 
            Ist eine Ausgleichszahlung (Rückzahlung)
          </label>

          <div class="split-section">
            <div class="split-header">
              <label>Aufteilung</label>
              <label class="checkbox-label">
                <input type="checkbox" id="tx-auto-split" checked> Gleichmäßig
              </label>
            </div>
            <div id="tx-splits-container"></div>
          </div>

          <div class="modal-actions">
            <button type="button" id="btn-tx-cancel" class="btn btn-secondary">Abbrechen</button>
            <button type="submit" class="btn btn-primary">Speichern</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal: Personen verwalten -->
    <div id="modal-persons" class="modal hidden">
      <div class="modal-content card">
        <h3>Personen verwalten</h3>
        <div class="add-person-box">
          <input type="text" id="new-person-name" placeholder="Name eingeben">
          <button id="btn-add-person" class="btn btn-primary">Hinzufügen</button>
        </div>
        <div id="persons-list" class="persons-list"></div>
        <button id="btn-persons-close" class="btn btn-secondary" style="margin-top:15px; width:100%;">Fertig</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/gas-api.js"></script>
  <script src="js/balances.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
